services:
  - type: web
    name: push-message-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  - type: web
    name: push-message-web
    runtime: static
    buildCommand: npm install --include=dev && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
